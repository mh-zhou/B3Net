version_name: b3_nyud_vit_l
out_dir: ./outputs/

train_db_name: NYUD
val_db_name: NYUD
trBatch: 3
valBatch: 6
nworkers: 2
ignore_index: 255

intermediate_supervision: true
val_interval: 1000
epochs: 999999
max_iter: 25000
optimizer: adam
optimizer_kwargs:
  lr: 2.0e-05
  weight_decay: 5.0e-06
scheduler: poly
grad_clip_param: {max_norm: 10, norm_type: 2}

model: B3Net
backbone: vitL
head: mlp
embed_dim: 512
mtt_resolution_downsample_rate: 2
PRED_OUT_NUM_CONSTANT: 64
REFINE_DEPTH: [18, 18, 18]
DILATED_RATIO:
  - [1, 2, 5, 1, 2, 5, 1, 2, 5, 1, 2, 5, 1, 2, 5, 1, 2, 5]
  - [1, 2, 5, 1, 2, 5, 1, 2, 5, 1, 2, 5, 1, 2, 5, 1, 2, 5]
  - [1, 2, 5, 1, 2, 5, 1, 2, 5, 1, 2, 5, 1, 2, 5, 1, 2, 5]
SQUEEZE_RATIO:
  - [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]
  - [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]
  - [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]

task_dictionary:
  include_semseg: true
  include_depth: true
  include_edge: true
  include_normals: true
  edge_w: 0.95
loss_kwargs:
  loss_weights:
    semseg: 1.0
    depth: 1.0
    normals: 10.0
    edge: 70.0
